<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CabGo – Cab Booking</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<style type="text/tailwindcss">
  .btn{@apply px-3 py-2 rounded-lg text-sm font-semibold bg-black text-white hover:bg-gray-800 disabled:opacity-40}
  .btn2{@apply px-3 py-2 rounded-lg text-sm font-semibold border border-gray-300 bg-white hover:bg-gray-100}
  .btnr{@apply px-3 py-2 rounded-lg text-sm font-semibold bg-red-600 text-white hover:bg-red-700}
  .inp{@apply w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white}
  .card{@apply bg-white rounded-xl border border-gray-200 p-4 mb-3}
</style>
</head>
<body class="bg-gray-100 text-gray-900">

<div id="auth" style="display:none" class="min-h-screen items-center justify-center p-4">
  <div id="authBox" class="card w-full max-w-sm !p-6"></div>
</div>

<div id="app" style="display:none" class="h-screen flex-col">
  <header class="bg-black text-white px-4 py-3 flex items-center justify-between">
    <div class="font-bold text-lg">🚖 CabGo</div>
    <div class="text-sm"><span id="who"></span><button class="underline ml-3" onclick="logout()">Logout</button></div>
  </header>
  <main class="flex-1 flex flex-col md:flex-row min-h-0">
    <div id="map" class="h-72 md:h-auto md:flex-1"></div>
    <aside id="panel" class="md:w-[420px] overflow-y-auto p-3"></aside>
  </main>
</div>

<div id="modal" style="display:none" class="fixed inset-0 bg-black/50 items-center justify-center z-[2000]"></div>
<div id="toast" style="display:none" class="fixed bottom-4 left-1/2 -translate-x-1/2 text-white text-sm px-4 py-2 rounded-lg z-[3000]"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Number(n || 0).toFixed(2);
const v = id => ($('#' + id) || {}).value;

let token = localStorage.getItem('cab_token');
let user = JSON.parse(localStorage.getItem('cab_user') || 'null');
let cfg = {}, map, stomp, subs = {}, authMode = 'login';
let ride = null, history = [], openRides = [], dismissed = new Set(), dash = null, stats = null, tickets = [], sosFeed = [];
let pickup = null, drop = null, quote = null, promo = '', me = null, simTimer = null, rateStars = 5;
let routeKey = null, routeCache = null;
const LY = {};

function toast(m, err) {
  const t = $('#toast'); t.textContent = m; t.style.background = err ? '#b91c1c' : '#111'; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500);
}
async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401 && token) { logout(); throw new Error('Session expired'); }
  if (res.status === 204) return null;
  const ct = res.headers.get('content-type') || '';
  const data = ct.includes('json') ? await res.json() : null;
  if (!res.ok) throw new Error((data && (data.message || data.error)) || 'Request failed (' + res.status + ')');
  return data;
}
const act = async fn => { try { await fn(); } catch (e) { toast(e.message, true); } };

/* ---------------- Auth ---------------- */
function showAuth() { $('#auth').style.display = 'flex'; $('#app').style.display = 'none'; renderAuth(); }
function renderAuth() {
  const reg = authMode === 'register';
  $('#authBox').innerHTML = `
    <h1 class="text-2xl font-bold mb-1">🚖 CabGo</h1>
    <p class="text-sm text-gray-500 mb-4">${reg ? 'Create your account' : 'Sign in to book or drive'}</p>
    <div class="space-y-2">
      ${reg ? `<input id="a-name" class="inp" placeholder="Full name"><input id="a-phone" class="inp" placeholder="Phone">
      <select id="a-role" class="inp" onchange="$('#drv').style.display=this.value==='DRIVER'?'block':'none'">
        <option value="RIDER">I'm a Rider</option><option value="DRIVER">I'm a Driver</option></select>
      <div id="drv" style="display:none" class="space-y-2"><input id="a-veh" class="inp" placeholder="Vehicle model"><input id="a-plate" class="inp" placeholder="Number plate"></div>` : ''}
      <input id="a-email" class="inp" placeholder="Email" type="email">
      <input id="a-pass" class="inp" placeholder="Password (min 6)" type="password">
      <button class="btn w-full" onclick="submitAuth()">${reg ? 'Register' : 'Login'}</button>
    </div>
    <p class="text-sm mt-3 text-center">${reg ? 'Have an account?' : 'New here?'}
      <button class="underline" onclick="authMode='${reg ? 'login' : 'register'}';renderAuth()">${reg ? 'Login' : 'Register'}</button></p>
    ${reg ? '' : `<div class="text-xs text-gray-500 mt-4 border-t pt-3">Demo logins:<br>rider@cab.com / rider123<br>driver@cab.com / driver123<br>admin@cab.com / admin123</div>`}`;
}
function submitAuth() {
  act(async () => {
    const body = authMode === 'login'
      ? { email: v('a-email'), password: v('a-pass') }
      : { name: v('a-name'), phone: v('a-phone'), role: v('a-role'), vehicleModel: v('a-veh'), vehiclePlate: v('a-plate'), email: v('a-email'), password: v('a-pass') };
    const r = await api('/api/auth/' + authMode, { method: 'POST', body });
    token = r.token; user = r.user;
    localStorage.setItem('cab_token', token); localStorage.setItem('cab_user', JSON.stringify(user));
    startApp();
  });
}
function logout() { localStorage.clear(); location.reload(); }

function startApp() {
  $('#auth').style.display = 'none'; $('#app').style.display = 'flex';
  $('#who').textContent = `${user.name} · ${user.role}`;
  initMap(); connectWS(); refreshAll();
}

/* ---------------- Map (Leaflet + OpenStreetMap + OSRM routing) ---------------- */
function initMap() {
  if (!map) {
    map = L.map('map').setView([23.0225, 72.5714], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
    map.on('click', onMapClick);
  }
  setTimeout(() => map.invalidateSize(), 150);
}
const dot = (ll, color, r, tip) => L.circleMarker(ll, { radius: r, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 }).addTo(map).bindTooltip(tip || '');
function clearLayers() { for (const k in LY) { if (LY[k]) map.removeLayer(LY[k]); delete LY[k]; } }
async function geocode(p) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=17&lat=${p.lat}&lon=${p.lng}`);
    const j = await r.json();
    return j.display_name ? j.display_name.split(',').slice(0, 3).join(',') : null;
  } catch { return null; }
}
async function drawRoute(a, b) {
  const key = a.join() + '|' + b.join();
  routeKey = key;
  let pts = routeCache && routeCache.key === key ? routeCache.pts : null;
  if (!pts) {
    pts = [a, b];
    try {
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`);
      const j = await r.json();
      if (j.routes && j.routes[0]) pts = j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    } catch {}
    routeCache = { key, pts };
  }
  if (routeKey !== key) return;
  if (LY.route) map.removeLayer(LY.route);
  LY.route = L.polyline(pts, { color: '#111', weight: 4 }).addTo(map);
  if (!LY.fitted) { map.fitBounds(LY.route.getBounds(), { padding: [40, 40] }); }
}
function syncMap() {
  if (!map) return;
  clearLayers();
  let a = null, b = null;
  if (ride) { a = [ride.pickupLat, ride.pickupLng]; b = [ride.dropLat, ride.dropLng]; }
  else if (user.role === 'RIDER') { if (pickup) a = [pickup.lat, pickup.lng]; if (drop) b = [drop.lat, drop.lng]; }
  if (a) LY.a = dot(a, '#16a34a', 9, 'Pickup');
  if (b) LY.b = dot(b, '#dc2626', 9, 'Drop');
  if (a && b) drawRoute(a, b); else routeKey = null;
  if (user.role === 'DRIVER') {
    if (me) LY.me = dot(me, '#2563eb', 10, 'You');
    if (!ride) openRides.filter(r => !dismissed.has(r.id)).forEach((r, i) => LY['o' + i] = dot([r.pickupLat, r.pickupLng], '#f59e0b', 8, 'Request #' + r.id));
  }
  if (user.role === 'RIDER' && ride && ride.driver && ride.driver.lat != null) LY.drv = dot([ride.driver.lat, ride.driver.lng], '#2563eb', 10, 'Driver');
}
function moveDriver(ll) {
  const k = user.role === 'DRIVER' ? 'me' : 'drv';
  if (LY[k]) LY[k].setLatLng(ll); else LY[k] = dot(ll, '#2563eb', 10, 'Driver');
}
function onMapClick(e) {
  const p = { lat: e.latlng.lat, lng: e.latlng.lng, addr: `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}` };
  if (user.role === 'RIDER' && !ride) {
    if (!pickup) pickup = p; else drop = p;
    geocode(p).then(a => { if (a) { p.addr = a; render(); } });
    syncMap(); updateQuote().then(render);
  } else if (user.role === 'DRIVER' && !ride) {
    act(async () => { await setMe(e.latlng); await refreshAll(); });
  }
}
async function setMe(ll) {
  me = [ll.lat, ll.lng];
  await api('/api/driver/location', { method: 'PUT', body: { lat: ll.lat, lng: ll.lng } });
}

/* ---------------- WebSocket (STOMP) ---------------- */
function connectWS() {
  if (stomp) return;
  stomp = new StompJs.Client({ brokerURL: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws', reconnectDelay: 3000 });
  stomp.onConnect = () => { subs = {}; setupSubs(); };
  stomp.activate();
}
function sub(key, dest, cb) {
  if (!stomp || !stomp.connected) return;
  if (subs[key] && subs[key].dest === dest) return;
  if (subs[key]) subs[key].s.unsubscribe();
  subs[key] = { dest, s: stomp.subscribe(dest, m => cb(JSON.parse(m.body))) };
}
function setupSubs() {
  if (user.role === 'DRIVER') sub('drivers', '/topic/drivers', () => refreshOpen());
  if (user.role === 'ADMIN') sub('sos', '/topic/sos', m => { sosFeed.unshift(m); toast('🚨 SOS from ' + m.by, true); render(); });
  if (ride) sub('ride', '/topic/ride/' + ride.id, onRideEvent);
  else if (subs.ride) { subs.ride.s.unsubscribe(); delete subs.ride; }
}
function onRideEvent(m) {
  if (m.type === 'LOCATION') { if (user.role === 'RIDER' && m.lat != null) moveDriver([m.lat, m.lng]); }
  else refreshAll();
}
function publish(dest, obj) {
  if (!stomp || !stomp.connected) return false;
  stomp.publish({ destination: dest, body: JSON.stringify(obj), headers: { 'content-type': 'application/json' } });
  return true;
}

/* ---------------- Data ---------------- */
async function refreshAll() {
  ride = await api('/api/rides/active');
  history = await api('/api/rides/my') || [];
  if (user.role === 'DRIVER') {
    dash = await api('/api/driver/dashboard');
    if (dash.driver.lat != null && !simTimer) me = [dash.driver.lat, dash.driver.lng];
    openRides = ride ? [] : await api('/api/rides/open');
  }
  if (user.role === 'ADMIN') { stats = await api('/api/admin/stats'); tickets = await api('/api/support'); }
  syncMap(); setupSubs(); render();
}
async function refreshOpen() {
  if (user.role !== 'DRIVER' || ride) return;
  openRides = await api('/api/rides/open'); syncMap(); render();
}
async function updateQuote() {
  if (!(pickup && drop)) { quote = null; return; }
  try { quote = await api('/api/rides/estimate', { method: 'POST', body: rideBody() }); }
  catch (e) { quote = null; toast(e.message, true); }
}
const rideBody = () => ({ pickupLat: pickup.lat, pickupLng: pickup.lng, pickupAddress: pickup.addr, dropLat: drop.lat, dropLng: drop.lng, dropAddress: drop.addr, promoCode: promo || null });
function resetPoints() { pickup = drop = null; quote = null; syncMap(); render(); }

/* ---------------- Views ---------------- */
const LABEL = { REQUESTED: 'Finding a driver…', ACCEPTED: 'Driver is on the way', ARRIVED: 'Driver has arrived', STARTED: 'Ride in progress', COMPLETED: 'Ride completed', CANCELLED: 'Cancelled' };
function badge(s) {
  const c = { REQUESTED: 'bg-amber-100 text-amber-800', ACCEPTED: 'bg-blue-100 text-blue-800', ARRIVED: 'bg-indigo-100 text-indigo-800', STARTED: 'bg-green-100 text-green-800', COMPLETED: 'bg-emerald-100 text-emerald-800', CANCELLED: 'bg-red-100 text-red-800' }[s] || 'bg-gray-100';
  return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold ${c}">${s}</span>`;
}
function render() {
  let h = user.role === 'RIDER' ? riderView() : user.role === 'DRIVER' ? driverView() : adminView();
  h += historyView();
  if (user.role !== 'ADMIN') h += supportView();
  $('#panel').innerHTML = h;
}
function riderView() {
  if (ride) return rideCard();
  return `<div class="card"><h2 class="font-bold mb-2">Book a ride</h2>
    <p class="text-sm text-gray-600 mb-2">Tap the map: first for <b class="text-green-600">pickup</b>, then <b class="text-red-600">drop</b>.</p>
    <div class="text-sm space-y-1 mb-2"><div>📍 ${pickup ? esc(pickup.addr) : '—'}</div><div>🏁 ${drop ? esc(drop.addr) : '—'}</div></div>
    <input class="inp mb-2" placeholder="Promo code (try WELCOME20)" value="${esc(promo)}" onchange="promo=this.value;updateQuote().then(render)">
    ${quote ? `<div class="bg-gray-50 rounded-lg p-3 text-sm mb-2">Distance <b>${quote.distanceKm.toFixed(1)} km</b> · ETA <b>${quote.etaMinutes} min</b><br>
      Fare <b class="text-lg">${inr(quote.fare)}</b>${quote.discount ? ` <span class="text-green-600">(saved ${inr(quote.discount)} with ${esc(quote.promoCode)})</span>` : ''}</div>` : ''}
    <div class="flex gap-2"><button class="btn flex-1" ${quote ? '' : 'disabled'} onclick="bookRide()">Request ride</button><button class="btn2" onclick="resetPoints()">Reset</button></div></div>`;
}
function rideCard() {
  const r = ride, d = r.driver, rider = user.role === 'RIDER';
  let who = '';
  if (rider) who = d ? `<div class="text-sm mt-2">🚗 <b>${esc(d.user.name)}</b> · ${esc(d.vehicleModel || '')} ${esc(d.vehiclePlate || '')}<br>⭐ ${d.ratingCount ? d.ratingAvg.toFixed(1) + ' (' + d.ratingCount + ')' : 'New driver'} · 📞 ${esc(d.user.phone || '—')}</div>`
    : `<div class="text-sm mt-2 text-gray-500">Looking for a nearby driver…</div>`;
  else who = `<div class="text-sm mt-2">👤 <b>${esc(r.rider.name)}</b> · 📞 ${esc(r.rider.phone || '—')}</div>`;
  const next = { ACCEPTED: ['ARRIVED', "I've arrived"], ARRIVED: ['STARTED', 'Start ride'], STARTED: ['COMPLETED', 'Complete ride'] }[r.status];
  let btns = '';
  if (rider) {
    if (r.status === 'REQUESTED' || r.status === 'ACCEPTED') btns += `<button class="btn2" onclick="cancelRide()">Cancel ride</button>`;
    if (r.status === 'COMPLETED' && !r.paid) btns += `<button class="btn flex-1" onclick="pay()">Pay ${inr(r.fare)}</button>`;
  } else {
    if (next) btns += `<button class="btn flex-1" onclick="setStatus('${next[0]}')">${next[1]}</button>`;
    if (r.status === 'ACCEPTED' || r.status === 'STARTED') btns += `<button class="btn2" onclick="simulate()" ${simTimer ? 'disabled' : ''}>Simulate driving</button>`;
  }
  if (r.status === 'ACCEPTED' || r.status === 'ARRIVED' || r.status === 'STARTED') btns += `<button class="btnr" onclick="sos()">SOS</button>`;
  return `<div class="card"><div class="flex justify-between items-center"><h2 class="font-bold">Ride #${r.id}</h2>${badge(r.status)}</div>
    <p class="text-sm font-semibold mt-1">${LABEL[r.status]}</p>
    <div class="text-sm mt-2">📍 ${esc(r.pickupAddress)}<br>🏁 ${esc(r.dropAddress)}</div>
    <div class="text-sm mt-1 text-gray-600">${r.distanceKm.toFixed(1)} km · <b>${inr(r.fare)}</b>${r.promoCode ? ' (' + esc(r.promoCode) + ')' : ''}</div>
    ${who}<div class="flex gap-2 mt-3 flex-wrap">${btns}</div></div>`;
}
function driverView() {
  if (!dash) return '';
  const d = dash.driver;
  let h = `<div class="card"><div class="flex justify-between items-center mb-3"><h2 class="font-bold">Driver dashboard</h2>
      <button class="${d.available ? 'btn' : 'btn2'}" onclick="toggleOnline()">${d.available ? '● Online' : '○ Offline'}</button></div>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div><div class="text-xs text-gray-500">Earnings</div><div class="font-bold">${inr(d.earnings)}</div></div>
      <div><div class="text-xs text-gray-500">Rating</div><div class="font-bold">${d.ratingCount ? '⭐ ' + d.ratingAvg.toFixed(1) : '—'}</div></div>
      <div><div class="text-xs text-gray-500">Completed</div><div class="font-bold">${dash.completed}</div></div></div>
    ${dash.reviews.length ? `<div class="mt-3 text-xs text-gray-600 border-t pt-2">${dash.reviews.slice(0, 3).map(x => `${'★'.repeat(x.stars)} ${esc(x.comment)}`).join('<br>')}</div>` : ''}</div>`;
  if (ride) return h + rideCard();
  if (!d.available) return h + `<p class="text-sm text-gray-500 p-2">Go online to receive ride requests. Tap the map to set your position.</p>`;
  const list = openRides.filter(r => !dismissed.has(r.id));
  h += `<h3 class="font-bold text-sm mb-2">Ride requests nearby</h3>`;
  if (!list.length) h += `<p class="text-sm text-gray-500 p-2">No requests yet. They appear here live. Tap the map to move your position.</p>`;
  return h + list.map(r => `<div class="card"><div class="flex justify-between"><b>#${r.id}</b><b>${inr(r.fare)}</b></div>
    <div class="text-sm mt-1">📍 ${esc(r.pickupAddress)}<br>🏁 ${esc(r.dropAddress)}</div>
    <div class="text-xs text-gray-500 my-1">${r.distanceKm.toFixed(1)} km · rider ${esc(r.rider.name)}</div>
    <div class="flex gap-2"><button class="btn flex-1" onclick="acceptRide(${r.id})">Accept</button><button class="btn2" onclick="dismissRide(${r.id})">Reject</button></div></div>`).join('');
}
function adminView() {
  if (!stats) return '';
  const s = stats;
  return `<div class="grid grid-cols-2 gap-2 mb-3">${[['Users', s.users], ['Drivers', s.drivers], ['Rides', s.rides], ['Revenue', inr(s.revenue)]]
      .map(([k, x]) => `<div class="card !mb-0 text-center"><div class="text-xs text-gray-500">${k}</div><div class="text-xl font-bold">${x}</div></div>`).join('')}</div>
    <div class="card"><h3 class="font-bold mb-2">Rides by status</h3>${Object.entries(s.ridesByStatus).map(([k, x]) => `<div class="flex justify-between text-sm py-0.5">${badge(k)}<b>${x}</b></div>`).join('')}</div>
    <div class="card"><h3 class="font-bold mb-2">Driver ranking</h3>${s.topDrivers.length ? s.topDrivers.map((d, i) => `<div class="text-sm flex justify-between"><span>${i + 1}. ${esc(d.name)} <span class="text-gray-500">${esc(d.vehicle)}</span></span><b>⭐ ${d.ratingAvg.toFixed(1)} (${d.ratingCount})</b></div>`).join('') : '<p class="text-sm text-gray-500">No ratings yet</p>'}</div>
    <div class="card"><h3 class="font-bold mb-2">🚨 Live SOS alerts</h3>${sosFeed.length ? sosFeed.map(m => `<div class="text-sm border-t py-1"><b>${esc(m.by)}</b> (${esc(m.role)}) · ride #${esc(m.rideId)}<br><span class="text-xs text-gray-500">${esc(m.at)} ${m.lat != null ? '· ' + Number(m.lat).toFixed(4) + ', ' + Number(m.lng).toFixed(4) : ''}</span></div>`).join('') : '<p class="text-sm text-gray-500">None</p>'}</div>
    <div class="card"><h3 class="font-bold mb-2">Support tickets</h3>${tickets.length ? tickets.slice(0, 6).map(t => `<div class="text-sm border-t py-1"><b>${esc(t.subject)}</b> <span class="text-xs text-gray-500">by ${esc(t.user.name)}</span><br>${esc(t.message)}</div>`).join('') : '<p class="text-sm text-gray-500">None</p>'}</div>`;
}
function historyView() {
  if (!history.length) return '';
  return `<div class="card"><h3 class="font-bold mb-2">Ride history</h3>${history.slice(0, 8).map(r => `
    <div class="flex items-center justify-between text-sm py-1.5 border-t first:border-0"><div>#${r.id} ${badge(r.status)}<div class="text-xs text-gray-500">${new Date(r.createdAt).toLocaleString()}</div></div>
    <div class="text-right"><b>${inr(r.fare)}</b><div class="flex gap-2 justify-end">
      ${r.status === 'COMPLETED' ? `<button class="underline text-xs" onclick="receipt(${r.id})">Receipt</button>` : ''}
      ${user.role === 'RIDER' && r.status === 'COMPLETED' && r.paid && !r.rated ? `<button class="underline text-xs" onclick="rateModal(${r.id})">Rate</button>` : ''}</div></div></div>`).join('')}</div>`;
}
function supportView() {
  return `<div class="card"><h3 class="font-bold mb-2">Help &amp; support</h3><input id="sup-s" class="inp mb-2" placeholder="Subject"><textarea id="sup-m" class="inp mb-2" rows="2" placeholder="Describe your issue"></textarea><button class="btn2" onclick="sendTicket()">Submit ticket</button></div>`;
}

/* ---------------- Actions ---------------- */
const bookRide = () => act(async () => { await api('/api/rides', { method: 'POST', body: rideBody() }); pickup = drop = null; quote = null; toast('Ride requested!'); await refreshAll(); });
const cancelRide = () => act(async () => { await api(`/api/rides/${ride.id}/cancel`, { method: 'POST' }); toast('Ride cancelled'); await refreshAll(); });
const acceptRide = id => act(async () => { await api(`/api/rides/${id}/accept`, { method: 'POST' }); await refreshAll(); });
const dismissRide = id => { dismissed.add(id); syncMap(); render(); };
const setStatus = to => act(async () => { await api(`/api/rides/${ride.id}/status?to=${to}`, { method: 'POST' }); await refreshAll(); });
const toggleOnline = () => act(async () => {
  const want = !dash.driver.available;
  if (want && !me) await setMe(map.getCenter());
  await api('/api/driver/status', { method: 'PUT', body: { available: want } });
  await refreshAll();
});
const sendTicket = () => act(async () => {
  await api('/api/support', { method: 'POST', body: { subject: v('sup-s'), message: v('sup-m') } });
  toast('Support ticket submitted'); $('#sup-s').value = ''; $('#sup-m').value = '';
});
function sos() {
  const ll = user.role === 'DRIVER' ? me : (ride && ride.driver && ride.driver.lat != null ? [ride.driver.lat, ride.driver.lng] : null);
  if (publish('/app/sos', { rideId: ride.id, by: user.name, role: user.role, lat: ll ? ll[0] : null, lng: ll ? ll[1] : null })) toast('🚨 SOS alert sent to admin');
  else toast('Not connected to live server', true);
}
function simulate() {   // simulated GPS: moves the driver and broadcasts location over WebSocket
  if (simTimer || !ride) return;
  const tgt = ride.status === 'ACCEPTED' ? [ride.pickupLat, ride.pickupLng] : [ride.dropLat, ride.dropLng];
  const from = me || [tgt[0] + 0.02, tgt[1] + 0.02], rid = ride.id;
  let i = 0;
  simTimer = setInterval(() => {
    i++; const t = i / 20;
    me = [from[0] + (tgt[0] - from[0]) * t, from[1] + (tgt[1] - from[1]) * t];
    moveDriver(me); publish(`/app/ride/${rid}/location`, { lat: me[0], lng: me[1] });
    if (i >= 20) {
      clearInterval(simTimer); simTimer = null;
      api('/api/driver/location', { method: 'PUT', body: { lat: me[0], lng: me[1] } }).catch(() => {});
      toast('Reached the point — update the ride status'); render();
    }
  }, 700);
  toast('Driving… (simulated GPS)'); render();
}
const receipt = id => act(async () => {
  const res = await fetch(`/api/rides/${id}/receipt`, { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) throw new Error('Receipt unavailable');
  const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = `receipt-${id}.pdf`; a.click();
});

/* ---------------- Payment (Stripe or demo) ---------------- */
const pay = () => act(async () => {
  const id = ride.id, fare = ride.fare;
  const r = await api(`/api/payments/${id}/intent`, { method: 'POST' });
  if (r.mode === 'DEMO') {
    await api(`/api/payments/${id}/confirm`, { method: 'POST' });
    toast('Payment successful (demo mode — add Stripe keys for real cards)');
    await refreshAll(); rateModal(id);
  } else await stripeModal(id, fare, r.clientSecret);
});
function loadStripe() {
  return new Promise((ok, no) => {
    if (window.Stripe) return ok();
    const s = document.createElement('script'); s.src = 'https://js.stripe.com/v3/'; s.onload = ok; s.onerror = () => no(new Error('Could not load Stripe')); document.head.appendChild(s);
  });
}
async function stripeModal(id, fare, secret) {
  await loadStripe();
  const stripe = Stripe(cfg.stripePublishableKey), card = stripe.elements().create('card');
  modal(`<h3 class="font-bold mb-2">Pay ${inr(fare)}</h3><div id="card-el" class="border rounded-lg p-3 mb-2"></div><div id="card-err" class="text-red-600 text-sm mb-2"></div>
    <div class="flex gap-2"><button id="pay-btn" class="btn flex-1">Pay</button><button class="btn2" onclick="closeModal()">Cancel</button></div>`);
  card.mount('#card-el');
  $('#pay-btn').onclick = async () => {
    $('#pay-btn').disabled = true;
    const { error } = await stripe.confirmCardPayment(secret, { payment_method: { card } });
    if (error) { $('#card-err').textContent = error.message; $('#pay-btn').disabled = false; return; }
    act(async () => { await api(`/api/payments/${id}/confirm`, { method: 'POST' }); closeModal(); toast('Payment successful'); await refreshAll(); rateModal(id); });
  };
}

/* ---------------- Modal & rating ---------------- */
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="bg-white rounded-xl p-5 w-96 max-w-[92vw]">${html}</div>`; m.style.display = 'flex'; }
function closeModal() { $('#modal').style.display = 'none'; $('#modal').innerHTML = ''; }
function rateModal(id) {
  rateStars = 5;
  modal(`<h3 class="font-bold mb-2">Rate your ride</h3><div id="stars" class="text-3xl mb-2 text-amber-500"></div>
    <textarea id="rv" class="inp mb-3" rows="3" placeholder="Feedback (optional)"></textarea>
    <div class="flex gap-2"><button class="btn flex-1" onclick="submitRating(${id})">Submit</button><button class="btn2" onclick="closeModal()">Skip</button></div>`);
  drawStars();
}
function drawStars() { $('#stars').innerHTML = [1, 2, 3, 4, 5].map(n => `<span class="cursor-pointer" onclick="rateStars=${n};drawStars()">${n <= rateStars ? '★' : '☆'}</span>`).join(''); }
const submitRating = id => act(async () => {
  await api(`/api/rides/${id}/rating`, { method: 'POST', body: { stars: rateStars, comment: v('rv') } });
  closeModal(); toast('Thanks for rating!'); await refreshAll();
});

/* ---------------- Boot ---------------- */
(async function boot() {
  try { cfg = await (await fetch('/api/config')).json(); } catch {}
  if (token && user) startApp(); else showAuth();
})();
</script>
</body>
